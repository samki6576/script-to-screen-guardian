version: "3.9"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./clickhouse/sample_data.sql:/docker-entrypoint-initdb.d/sample_data.sql
    environment:
      - CLICKHOUSE_DB=production_db

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CLICKHOUSE_HOST=clickhouse
    depends_on:
      - clickhouse

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - clickhouse

volumes:
  clickhouse_data:
  grafana_data:
